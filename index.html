<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantoral Litúrgico - Parroquia Madre de los Dolores</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #16a085; --admin-color: #b10707; --danger-color: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: #faf8fa; margin: 0; }
        header { background-color: var(--primary-color); color: rgb(255, 255, 255); padding: 2rem 1rem; text-align: center; }
        nav { background-color: var(--secondary-color); display: flex; justify-content: center; padding: 0.8rem; gap: 1.5rem; }
        nav button { color: rgb(255, 255, 255); background: none; border: none; font-weight: 600; cursor: pointer; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        #adminPanel { display: none; background: #fff3cd; border: 2px solid var(--admin-color); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
        .grid-cantos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: rgb(255, 255, 255); padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn { background: var(--secondary-color); color: rgb(255, 255, 255); padding: 0.6rem 1rem; border-radius: 4px; border: none; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-borrar { background: var(--danger-color); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); overflow-y: auto; }
        .modal-content { background: #ffffff; margin: 5% auto; padding: 2rem; width: 90%; max-width: 650px; border-radius: 8px; }
        
        .cuadro-canto {
            background: #ffffff;
            border: 1px solid #e0dce1;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            max-height: 450px;
            overflow-y: auto;
        }
        pre { background: #f7f4f8; padding: 1rem; border-radius: 6px; white-space: pre-wrap; word-wrap: break-word; }
        /* NUEVO: Estilo para el nombre de secuencia */
        .nombre-secuencia { color: var(--admin-color); font-weight: bold; font-size: 0.9rem; text-transform: uppercase; margin-bottom: -5px; }
    </style>
</head>
<body>

<header>
    <h1>Cantoral Litúrgico</h1>
    <h1>Parroquia Madre de los Dolores</h1>
</header>

<nav>
    <button onclick="toggleAdmin()">🔐 Modo Administrador</button>
</nav>

<div class="container">
    <div id="adminPanel">
        <h3>Panel de Administración</h3>
        <input type="text" id="nuevaSecuencia" placeholder="Nombre de Secuencia (ej: Entrada, Salida...)" style="width:100%; padding:8px; margin-bottom:10px;"><!-- NUEVO -->
        <input type="text" id="nuevoTitulo" placeholder="Título" style="width:100%; padding:8px; margin-bottom:10px;">
        <input type="text" id="nuevoTono" placeholder="Tono" style="width:100%; padding:8px; margin-bottom:10px;">
        <input type="text" id="nuevoYoutube" placeholder="URL YouTube" style="width:100%; padding:8px; margin-bottom:10px;">
        <label>Imágenes:</label> <input type="file" id="inputImagenes" accept="image/*" multiple style="display:block;">
        <label>Audio (MP3):</label> <input type="file" id="inputAudio" accept="audio/*" style="display:block;">
        <button class="btn" style="background:var(--admin-color)" onclick="guardarCanto()">Guardar Canto</button>
    </div>

    <div class="grid-cantos" id="gridCantos"></div>
</div>

<div id="modalCanto" class="modal">
    <div class="modal-content">
        <span onclick="cerrarCanto()" style="float:right; cursor:pointer; font-size:24px;">&times;</span>
        
        <div class="cuadro-canto">
            <div id="modalSecuencia" class="nombre-secuencia"></div> <!-- NUEVO -->
            <h2 id="modalTitulo" style="margin-top:0;"></h2>
            <p><strong>Tono:</strong> <span id="modalTono"></span></p>
            <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 15px 0;">
         
            <audio id="modalAudio" controls style="width:100%; margin-top:10px;"></audio>
            <iframe id="modalYoutube" style="width:100%; height:200px; margin-top:10px; border:none; border-radius:4px;"></iframe>
            <div id="mImagenes" style="margin-top:15px;"></div>
        </div>

        <button class="btn" style="background:#2980b9; margin-top:15px;" onclick="abrirVisorPDF()">📄 Ver en PDF / Imprimir</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyA_JJPx2ajl5svqI2AxCI6WCBNW8bSDUlw", authDomain: "church-7486a.firebaseapp.com", projectId: "church-7486a", storageBucket: "church-7486a.firebasestorage.app", messagingSenderId: "516455418242", appId: "1:516455418242:web:e5dc93f96860885222e79b" };
    
    // Inicializar Firebase solo si no ha sido inicializado antes
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let imgArray = [], audioData = "", cantoActual = null, documentos = [];

    function convertirUrlYoutube(url) {
        let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        let match = url.match(regExp);
        return (match && match[2].length === 11) ? 'https://www.youtube.com/embed/' + match[2] : url;
    }

    // Event Listeners para archivos
    document.getElementById('inputImagenes').addEventListener('change', (e) => {
        imgArray = [];
        for(let f of e.target.files) {
            let reader = new FileReader();
            reader.onload = (ev) => imgArray.push(ev.target.result);
            reader.readAsDataURL(f);
        }
    });

    document.getElementById('inputAudio').addEventListener('change', (e) => {
        let reader = new FileReader();
        reader.onload = (ev) => audioData = ev.target.result;
        reader.readAsDataURL(e.target.files[0]);
    });

    // Carga de datos
    db.collection("cantos").onSnapshot(snap => {
        documentos = snap.docs;
        renderizar();
    });

    function renderizar() {
        const adminPanel = document.getElementById('adminPanel');
        let esAdmin = (adminPanel && adminPanel.style.display === 'block');
        const grid = document.getElementById('gridCantos');
        if(!grid) return;

        grid.innerHTML = documentos.map(doc => `
            <div class="card">
                <large style="color:#f50c0c">${doc.data().secuencia || ''}</large>
                <h3>${doc.data().titulo}</h3>
                <button class="btn" onclick="abrir('${doc.id}')">Ver Canto</button>
                ${esAdmin ? `<button class="btn btn-borrar" onclick="eliminarCanto('${doc.id}')">Borrar</button>` : ''}
            </div>
        `).join('');
    }

    function toggleAdmin() {
        if (prompt("Contraseña:") === "MOS@") {
            let p = document.getElementById('adminPanel');
            p.style.display = (p.style.display === 'block') ? 'none' : 'block';
            renderizar();
        } else { alert("Contraseña incorrecta"); }
    }

    function guardarCanto() {
        db.collection("cantos").add({
            titulo: document.getElementById('nuevoTitulo').value,
            secuencia: document.getElementById('nuevaSecuencia').value,
            tono: document.getElementById('nuevoTono').value,
            youtube: convertirUrlYoutube(document.getElementById('nuevoYoutube').value),
            imagenes: imgArray,
            audio: audioData
        }).then(() => {
            alert("Guardado");
            // Limpiar campos aquí si lo deseas
        });
    }

    function eliminarCanto(id) {
        if(confirm("¿Borrar?")) db.collection("cantos").doc(id).delete();
    }

    function abrir(id) {
        db.collection("cantos").doc(id).get().then(doc => {
            cantoActual = doc.data();
            document.getElementById('modalTitulo').innerText = cantoActual.titulo || "";
            document.getElementById('modalSecuencia').innerText = cantoActual.secuencia || "";
            document.getElementById('modalTono').innerText = cantoActual.tono;
            document.getElementById('modalYoutube').src = cantoActual.youtube || "";
            document.getElementById('modalAudio').src = cantoActual.audio || "";
            document.getElementById('mImagenes').innerHTML = (cantoActual.imagenes || []).map(img => `<img src="${img}" style="width:100%; margin-top:10px; border-radius:4px;">`).join('');
            document.getElementById('modalCanto').style.display = "block";
        });
    }

    function cerrarCanto() { document.getElementById('modalCanto').style.display = 'none'; }

    function abrirVisorPDF() {
        const c = cantoActual;
        const win = window.open('', '_blank');
        win.document.write(`<html><head><title>${c.titulo}</title></head>
            <body style="font-family:sans-serif; padding:40px;">
                <div style="text-align:center; border-bottom:2px solid #2c3e50; margin-bottom:20px;">
                    <h1>Parroquia Madre de los Dolores</h1>
                    <h3>${c.secuencia || 'Cantoral Litúrgico'}</h3>
                </div>
                <h1 style="margin-bottom:5px;">${c.titulo}</h1>
                <p><strong>Momento Litúrgico:</strong> ${c.momento}</p>
                <p><strong>Tono:</strong> ${c.tono}</p>
                <hr>
                <pre style="font-size:16px;">${c.letra}</pre>
            </body></html>`);
    }
</script>
</body>
</html>
